name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Supabase configuration
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Repository variable SUPABASE_URL belum diatur. Buka Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Repository secret SUPABASE_ANON_KEY belum diatur. Buka Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org id.kosmanage .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/KosManage.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KosManage-Android-APK
          path: build/app/outputs/flutter-apk/KosManage.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK for direct download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KosManage APK (Latest)
          body: |
            APK Android terbaru yang dibangun otomatis dari branch main.
            Unduh KosManage.apk pada bagian Assets di bawah.
          files: build/app/outputs/flutter-apk/KosManage.apk
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true

      - name: Publish versioned APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/KosManage.apk
          generate_release_notes: true
