name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t changed_files < <(
              git diff --name-only \
                "${{ github.event.pull_request.base.sha }}" \
                "${{ github.event.pull_request.head.sha }}" \
                -- '*.dart'
            )
          else
            mapfile -t changed_files < <(
              git diff --name-only \
                "${{ github.event.before }}" \
                "${{ github.sha }}" \
                -- '*.dart'
            )
          fi

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No Dart files changed; skipping format check."
            exit 0
          fi

          printf 'Checking Dart formatting for changed files:\n'
          printf ' - %s\n' "${changed_files[@]}"
          dart format --output=none --set-exit-if-changed "${changed_files[@]}"

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test
