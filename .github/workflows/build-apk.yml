name: Android APK

on:
  push:
    branches:
      - feat/owner-only-auth-auto-refresh
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Validate Supabase build configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set repository Actions variables SUPABASE_URL and SUPABASE_ANON_KEY before building a usable APK."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Generate Android platform files
        run: flutter create --platforms=android --org id.kosmanage .

      - name: Ensure Android internet permission
        shell: bash
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$manifest"
          fi
          grep -q 'android.permission.INTERNET' "$manifest"

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kosmanage-mobile-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
