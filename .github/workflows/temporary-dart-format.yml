name: Temporary Dart formatter

on:
  push:
    branches:
      - feature/owner-mobile-modules

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/owner-mobile-modules
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable

      - name: Format Dart sources
        run: dart format .

      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          rm .github/workflows/temporary-dart-format.yml
          git add .
          git commit -m "style: format Dart sources"
          git push origin HEAD:feature/owner-mobile-modules
